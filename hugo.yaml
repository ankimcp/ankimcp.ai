baseURL: https://ankimcp.ai/
locale: en-US
title: Anki MCP

# English stays at the site root so existing URLs don't move; other languages
# live under their own prefix (/pt-br/...). Only some pages are translated —
# untranslated ones exist in English only.
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    label: English
    locale: en-US
    weight: 1
  pt-br:
    label: Português (Brasil)
    locale: pt-BR
    weight: 2
    # No Portuguese blog, so skip the empty /pt-br/tags/ and /pt-br/categories/ pages.
    disableKinds:
      - taxonomy
      - term
    params:
      description: Conecte assistentes de IA como o Claude e o ChatGPT aos seus flashcards do Anki. Crie cards na hora, revise em linguagem natural e estude melhor com repetição espaçada e IA.
    menus:
      main:
        - name: Documentação
          pageRef: /docs
          weight: 1
        - name: Preços
          pageRef: /pricing
          weight: 2
        # Blog and About aren't translated — link to the English pages.
        - name: Blog
          url: /blog/
          weight: 3
        - name: Sobre
          url: /about/
          weight: 4
        - name: Fórum
          url: "https://forum.ankimcp.ai/"
          weight: 5
        - name: Buscar
          weight: 6
          params:
            type: search
        - name: Idioma
          weight: 7
          params:
            type: language-switch
        - name: GitHub
          weight: 8
          url: "https://github.com/ankimcp"
          params:
            icon: github
        - name: Entrar
          weight: 9
          url: "https://web.ankimcp.ai"

# Sitemap configuration for better SEO
sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

# Enhanced frontmatter configuration
frontmatter:
  lastmod:
    - lastmod
    - :git
    - date
    - publishDate

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Pricing
      pageRef: /pricing
      weight: 2
    - name: Blog
      pageRef: /blog
      weight: 3
    - name: About
      pageRef: /about
      weight: 4
    - name: Forum
      url: "https://forum.ankimcp.ai/"
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: Language
      weight: 7
      params:
        type: language-switch
    - name: GitHub
      weight: 8
      url: "https://github.com/ankimcp"
      params:
        icon: github
    - name: Sign in
      weight: 9
      url: "https://web.ankimcp.ai"

markup:
  goldmark:
    # Pages embed screenshots with raw <img src="file.png"> tags, which Hugo's
    # shared-resource render hooks don't rewrite. Copy bundle images into each
    # language's output so those relative paths work under /pt-br/ too.
    duplicateResourceFiles: true
    renderer:
      unsafe: true
  highlight:
    # Emit CSS classes (not inline Monokai styles) so Hextra's own light/dark
    # syntax-highlight themes apply — softer, theme-matched code blocks.
    noClasses: false

minify:
  disableJS: true
  tdewolff:
    html:
      keepWhitespace: false

params:
  description: Connect AI assistants like Claude and ChatGPT to your Anki flashcards. Create cards instantly, review with natural language, and study smarter with AI-powered spaced repetition.

  # SEO metadata
  author:
    name: Anki MCP Team
    email: support@ankimcp.ai
  keywords: ["anki mcp", "claude anki", "chatgpt anki", "ai flashcards", "anki integration", "model context protocol", "spaced repetition ai"]

  # OpenGraph metadata for social sharing (WhatsApp, Facebook, etc)
  opengraph:
    title: "Anki MCP - Connect Claude & ChatGPT to Anki Flashcards"
    description: Transform Anki into an AI-powered study system. Natural language reviews, instant card creation, and audio flashcards with Claude, ChatGPT, and web-based AI.
    type: website
    locale: en_US

  # Twitter Card metadata
  twitter:
    card: summary_large_image
    title: "Anki MCP - AI-Powered Flashcard Management"
    description: Connect Claude & ChatGPT to your Anki flashcards for instant card creation and natural language reviews.

  images:
    - /images/og-image.png

  banner:
    key: 'maintenance-complete-2026-09-19'
    message: |
      ✅ **Maintenance completed** — all services are back online. [Status →](https://status.ankimcp.ai/)

  analytics:
    umami:
      serverURL: https://analytics.anatoly.dev
      websiteID: 0d1e55ed-613e-4207-bd8d-4710717b40fc
      scriptName: script.js

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: favicon.svg
      width: 28
      height: 28

  page:
    width: wide

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: true
